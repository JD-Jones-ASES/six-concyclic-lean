status:
  scope: >-
    Fourteen compared theorems over ten compared definitions restated from the source's challenge
    file. Unconditional: the tensor criterion for six concyclic points, for at most six
    concyclic points, for every spherical set of at most m + 4 points where m is the dimension of its
    affine span (in its own space and field), for at most six spherical points in any dimension with
    any affine span, for at most six spherical points that affinely span their space, for at most
    five spherical points in any dimension, and for every spherical set with algebraic coordinates;
    the criterion implies sphericity; for algebraic coordinates the criterion is sphericity.
    Conditional on the classification's sufficiency half, taken as an explicit hypothesis: every
    spherical set of at most six points is Ramsey (any dimension, any affine span), every set of at
    most six circle points is Ramsey, every spherical set of at most m + 4 points is Ramsey, every
    spanning spherical set with algebraic coordinates is Ramsey; conditional on both halves, a
    spanning set with algebraic coordinates is Ramsey if and only if it is spherical. Not claimed:
    the classification; the criterion or the Ramsey property for arbitrary spherical sets of more
    than m + 4 points; the failure of the criterion for the heptagon in Lean, and hence the sharpness
    of the dimension bound (both on paper, the former also by an exact checker in note/). The
    intentional placeholders of Challenge.lean are excluded from proof counts; Solution.lean does not
    import Challenge.lean.
