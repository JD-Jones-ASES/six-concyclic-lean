    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Supplies the tensor criterion and the classification. The ten definitions of Challenge.lean are
      restated character for character from the project's lean/ComparatorChallenges/EuclideanRamsey.lean
