automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) was used throughout; the theorems, their
        proofs, the searches and the checkers arose in that process, and the repository was written by Claude. Lean v4.35.0-rc2 and Mathlib
        v4.35.0-rc2 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed manifest
        and lake update is never run; there are no GitHub Actions workflows. There is no native_decide and
        no enumeration beyond fin_cases over Fin 2, Fin 3 and Fin 6 and one interval_cases: the six-point
        certificate is a set of polynomial identities closed by ring, field_simp and linear_combination in
        an abstract field, the lifts are matrix algebra over the tensor ring, arithmetic side goals use
        linarith, nlinarith and omega, and decide is used only for inequalities between literal elements
        of Fin 6.
  spend_usd: "not tracked"
  notes: "See DISCLOSURE.md."

fidelity:
  divergences: >-
    The ten definitions are the source's, character for character, in the namespace SixConcyclic.
    Sphericity is stated as the source's circle corollary states it, as the existence of a centre and
    a radius with dist (a i) c = r for every i. Algebraic coordinates are stated coordinatewise, as
    IsAlgebraic Q (a i j) for every i and j. The hypotheses hsuff and hclass are the sufficiency half
    and the full statement of the source's Theorem 1.1 with its hypotheses (at least two points,
    positive dimension, injective, affine span the whole space); nothing about them is proved. The
    Ramsey theorems for at most six spherical points carry no spanning hypothesis and allow the empty
    and the one-point configuration, which the source's circle corollary excludes with 0 < s; the
    algebraic Ramsey theorems carry the hypotheses of Theorem 1.1 because no congruent algebraic
    spanning representative is constructed.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents
    developed and cross-reviewed the proof, the statements were checked against the source's challenge
    file, and VERIFICATION.md states what is checked and what is not. Mechanical correctness and
    agreement of formal statements do not establish priority or significance.

alignment:
  namespace: "SixConcyclic"
  statements:
    - source: "This development; the case the source's Corollary 7.4 leaves open"
      lean: "SixConcyclic.six_concyclic_fieldCriterion"
      module: "Solution"
      status: "proved"
      note: "Every set of six distinct points on a circle satisfies FieldCriterion."
    - source: "This development; the at-most-five case reproves the route of the source's Corollary 7.4 (Proposition 7.3) by its own isolators"
      lean: "SixConcyclic.at_most_six_concyclic_fieldCriterion"
      module: "Solution"
      status: "proved"
      note: "Every set of at most six distinct points on a circle satisfies FieldCriterion."
    - source: "This development; the method of the source's Proposition 7.3 for at most five points and for six points spanning at least three dimensions, the six-point certificate in the plane"
      lean: "SixConcyclic.at_most_six_spherical_spanning_fieldCriterion"
      module: "Solution"
      status: "proved"
      note: >-
        Every spherical set of at most six distinct points that affinely spans its space satisfies
        FieldCriterion, in every dimension.
    - source: "This development, generalising the source's Corollary 7.4 to every dimension"
      lean: "SixConcyclic.at_most_five_spherical_fieldCriterion"
      module: "Solution"
      status: "proved"
      note: "Every spherical set of at most five distinct points satisfies FieldCriterion, with no spanning hypothesis."
    - source: "This development; the source does not state it"
      lean: "SixConcyclic.algebraic_spherical_fieldCriterion"
      module: "Solution"
      status: "proved"
      note: "Every spherical set whose coordinates are algebraic numbers satisfies FieldCriterion, whatever its size."
    - source: "The source's Corollary 7.1, re-proved from the criterion alone"
      lean: "SixConcyclic.fieldCriterion_spherical"
      module: "Solution"
      status: "proved"
      note: "FieldCriterion implies the existence of a sphere through the points."
    - source: "This development"
      lean: "SixConcyclic.algebraic_fieldCriterion_iff_spherical"
      module: "Solution"
      status: "proved"
      note: "For algebraic coordinates, FieldCriterion holds if and only if the points are spherical."
    - source: "This development, conditional on the sufficiency half of the source's Theorem 1.1"
      lean: "SixConcyclic.at_most_six_spherical_ramsey_of_sufficiency"
      module: "Solution"
      status: "proved"
      note: >-
        Given hsuff, every spherical set of at most six distinct points, in any dimension and with any
        affine span, is Ramsey.
    - source: "This development, conditional on the sufficiency half of the source's Theorem 1.1; the six-point analogue of the source's Corollary 7.4"
      lean: "SixConcyclic.at_most_six_circle_points_ramsey_of_sufficiency"
      module: "Solution"
      status: "proved"
      note: "Given hsuff, every set of at most six distinct points on a circle is Ramsey."
    - source: "This development, conditional on the sufficiency half of the source's Theorem 1.1"
      lean: "SixConcyclic.algebraic_spherical_ramsey_of_sufficiency"
      module: "Solution"
      status: "proved"
      note: "Given hsuff, every spanning spherical set with algebraic coordinates is Ramsey."
    - source: "This development, conditional on the source's Theorem 1.1"
      lean: "SixConcyclic.algebraic_ramsey_iff_spherical_of_classification"
      module: "Solution"
      status: "proved"
      note: "Given hclass, a spanning set with algebraic coordinates is Ramsey if and only if it is spherical."

