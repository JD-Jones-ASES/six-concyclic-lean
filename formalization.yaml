status:
  scope: >-
    Eleven compared declarations over ten compared definitions restated from the source's challenge
    file. Unconditional: the tensor criterion for six concyclic points, for at most six concyclic
    points, for at most six spherical points that affinely span their space, for at most five
    spherical points in any dimension, and for every spherical set with algebraic coordinates; the
    criterion implies sphericity; for algebraic coordinates the criterion is sphericity. Conditional
    on the classification's sufficiency half, taken as an explicit hypothesis: every spherical set of
    at most six points is Ramsey (any dimension, any affine span), every set of at most six circle
    points is Ramsey, every spanning spherical set with algebraic coordinates is Ramsey; conditional
    on both halves, a spanning set with algebraic coordinates is Ramsey if and only if it is
    spherical. Not claimed: the classification; any Ramsey statement for seven or more points; the
    criterion for six non-spanning spherical points outside the plane; the failure of the criterion
    for the heptagon in Lean (on paper and by an exact checker in note/). The intentional
    placeholders of Challenge.lean are excluded from proof counts; Solution.lean does not import
    Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
