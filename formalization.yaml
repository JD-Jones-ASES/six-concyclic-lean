version: "v0.4"

project:
  name: "Six concyclic points satisfy the Euclidean Ramsey tensor criterion, as do every spanning spherical set of at most six points and every spherical set with algebraic coordinates; given the classification's sufficiency half, every spherical set of at most six points and every spanning algebraic spherical set is Ramsey"
  description: >-
    A Lean 4 development around the tensor criterion of the classification of finite Euclidean
    Ramsey configurations (openai/math, family 172). With the criterion's definitions restated
    character for character from that project's challenge file: every set of six distinct points on
    a circle satisfies the criterion, by an explicit certificate (the product of the two bilinear
    forms through the first three and the last three points of a homogeneous parametrisation of the
    circle, scaled and conjugated by the parametrisation); every set of at most six concyclic points,
    every spherical set of at most six points that affinely spans its space, and every spherical set
    of at most five points in any dimension satisfy it, by an adjugate lift of an F-rational sphere
    through isolating quadrics; every spherical set with algebraic coordinates satisfies it, of any
    size, by the separability idempotent of F tensor F; the criterion always implies sphericity, so
    for algebraic coordinates it is exactly sphericity. Given the sufficiency half of the
    classification as an explicit hypothesis (quantified as the source states its Theorem 1.1),
    every spherical set of at most six points is Ramsey and every spanning spherical set with
    algebraic coordinates is Ramsey; given both halves, a spanning set with algebraic coordinates is
    Ramsey if and only if it is spherical. The source proves the Ramsey property for at most five
    circle points; six is the first case its method of independent quadratic rows cannot reach. With
    the seven-point non-Ramsey circle set of A cyclic non-Ramsey heptagon (arXiv:2609.23327), the
    least size of a non-Ramsey spherical set is seven, given the classification; the research note
    in note/ states this and verifies by an exact derivation identity that the heptagon fails the
    criterion. The classification is not proved here. The restated definitions and a few adapted
    lemmas derive from Apache-2.0 work of OpenAI (NOTICE, LICENSES/Apache-2.0.txt); the rest is MIT.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

